<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="../assets/css/recipe_style.css">
</head>
<body class="recipe">
<header>
    {% if page.title %}
        {{ page.title }}
    {% else %}
        {{ page.name | remove: ".md" | replace: "_", " " | capitalize }}
    {% endif %}
</header>
<main>
    {{ content }}
</main>
<footer>
    <a href="../recipes">← Back to recipes</a>
</footer>
</body>
</html>
